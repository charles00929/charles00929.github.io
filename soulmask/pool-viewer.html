<!DOCTYPE html>
<html lang="zh-tw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天賦池瀏覽器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body { background: #1a1c1e; color: #d8dde3; font-size: .875rem; }
    .layer-badge {
      display: inline-block;
      font-size: .65rem;
      font-weight: 700;
      padding: .1rem .35rem;
      border-radius: .25rem;
      vertical-align: middle;
      margin-right: .3rem;
    }
    .l1 { background:#495057; color:#fff; }
    .l2 { background:#1a6fc4; color:#fff; }
    .l3 { background:#3a3d42; color:#adb5bd; }
    .l4 { background:#2e3136; color:#8a9099; }

    .section-card {
      background:#26292d;
      border-radius:.5rem;
      box-shadow:0 1px 6px rgba(0,0,0,.4);
      margin-bottom:1rem;
      border:1px solid #3a3d42;
    }
    .section-header {
      display:flex; align-items:center; gap:.5rem;
      padding:.6rem 1rem;
      border-bottom:1px solid #3a3d42;
      cursor:pointer;
      user-select:none;
      border-radius:.5rem .5rem 0 0;
      font-size:1rem;
    }
    .section-header strong { font-size:1rem; }
    .section-header:hover { background:#2e3136; }
    .section-body { padding:.75rem 1rem; }

    .talent-grid {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }
    .talent-chip {
      display:inline-flex; align-items:center; gap:.35rem;
      padding:.3rem .55rem;
      border-radius:.3rem;
      background:#1a1c1e;
      border:1px solid #3a3d42;
      font-size:.78rem;
      color:#c8cdd3;
      cursor:default;
      transition: background .1s, border-color .1s;
    }
    .talent-chip:hover { background:#2e3136; border-color:#5a6069; color:#fff; }
    .talent-chip img {
      width:28px; height:28px; object-fit:contain; border-radius:.25rem;
      background:#111315; padding:1px;
    }
    .chip-id { font-size:.68rem; color:#555; margin-left:.1rem; }
    .chip-empty { color:#555; font-style:italic; font-size:.75rem; }

    .filter-bar { background:#26292d; border-bottom:1px solid #3a3d42; }
    .filter-bar select, .filter-bar input {
      font-size:.82rem;
      background:#1a1c1e; color:#d8dde3; border-color:#4a4d52;
    }
    .filter-bar select:focus, .filter-bar input:focus {
      background:#1a1c1e; color:#fff; border-color:#6c9fd4; box-shadow:none;
    }
    .filter-bar select option { background:#26292d; }

    .sub-section {
      border-left: 2px solid #3a3d42;
      padding-left: 1.25rem;
      margin-top: .6rem;
    }
    .sub-section.l2-battle  { border-color: #1a6fc4; }
    .sub-section.l2-craft   { border-color: #c06000; }
    .sub-section.l2-general { border-color: #4a4d52; }
    .sub-section.l3 { border-color: #3a3d42; padding-left: 1.5rem; }
    .sub-section.l4 { border-color: #2e3136; padding-left: 1.75rem; }

    .sub-label {
      font-size:.72rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.05em; color:#7a8290; margin-bottom:.35rem;
    }
    .collapse-icon { margin-left:auto; color:#555; font-size:.8rem; }
    .badge-count { background:#3a3d42; color:#adb5bd; font-size:.65rem;
                   padding:.1rem .35rem; border-radius:.25rem; }

    /* L2 sub-headers */
    .section-header.l2-header { background:#1e2a38; border-radius:.35rem; border:1px solid #2a4060; }
    .section-header.l2-header:hover { background:#243347; }
    .section-header.l3-header { background:transparent; border-radius:.35rem; border:none; padding-left:0; }
    .section-header.l3-header:hover { background:#2e3136; border-radius:.3rem; }

    /* Navbar override */
    .navbar.bg-dark { background:#111315 !important; border-bottom:1px solid #2a2d30; }
    .btn-outline-light { border-color:#4a4d52; color:#aaa; }
    .btn-outline-light:hover { background:#2e3136; color:#fff; border-color:#6c9fd4; }
    .btn-outline-secondary { border-color:#4a4d52; color:#aaa; background:transparent; }
    .btn-outline-secondary:hover { background:#2e3136; color:#fff; border-color:#6c9fd4; }
    strong { color:#e0e4ea; }
  </style>
</head>
<body>

<div id="app">
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark py-2 sticky-top">
    <div class="container-fluid">
      <span class="navbar-brand h6 mb-0">⚔️ Soulmask</span>
      <div class="position-absolute start-50 translate-middle-x d-flex gap-1">
        <a href="index.html" class="btn btn-sm btn-outline-light">天賦模擬器</a>
        <span class="btn btn-sm btn-secondary disabled">天賦池瀏覽器</span>
      </div>
    </div>
  </nav>

  <!-- Filter bar -->
  <div class="filter-bar sticky-top py-2 px-3 d-flex gap-2 align-items-center flex-wrap" style="top:52px;z-index:100">
    <input v-model="search" type="text" class="form-control form-control-sm" style="max-width:200px" placeholder="搜尋天賦名稱...">
    <select v-model="filterSlot" class="form-select form-select-sm" style="max-width:160px">
      <option value="">所有 Slot</option>
      <option value="normal">一般 (normal)</option>
      <option value="tribe">部落 (tribe)</option>
      <option value="origin">出身 (origin)</option>
      <option value="title">稱號 (title)</option>
      <option value="experience">經驗 (experience)</option>
    </select>
    <span class="text-muted small ms-2">共 {{ matchCount }} 筆天賦</span>
    <button class="btn btn-outline-secondary btn-sm ms-auto" @click="expandAll">全展開</button>
    <button class="btn btn-outline-secondary btn-sm" @click="collapseAll">全收合</button>
  </div>

  <div v-if="loading" class="text-center py-5 text-muted">
    <div class="spinner-border spinner-border-sm me-2"></div>載入資料中...
  </div>

  <div v-else class="container-fluid py-3" style="max-width:1400px">
    <pool-node
      v-for="slotKey in visibleSlotKeys" :key="slotKey"
      :node-key="slotKey"
      :data="pools[slotKey] ?? []"
      :depth="0" :path="[]">
    </pool-node>
  </div>
</div>

<!-- Tooltip popup -->
<div id="g-tip" style="
  display:none; position:fixed; z-index:9999;
  max-width:240px; background:rgba(20,20,30,.92); color:#f0f0f0;
  border-radius:.4rem; padding:.5rem .65rem; font-size:.78rem;
  pointer-events:none; line-height:1.45; box-shadow:0 3px 12px rgba(0,0,0,.4)
"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const { createApp, computed } = Vue;

const SLOT_ORDER  = ['experience', 'tribe', 'origin', 'title', 'normal'];
const SLOT_LABELS = {
  experience: 'experience — 經驗天賦',
  tribe:      'tribe — 部落天賦',
  origin:     'origin — 出身天賦',
  title:      'title — 稱號天賦',
  normal:     'normal — 一般天賦',
};

const app = createApp({
  data() {
    return {
      loading:    true,
      talents:    [],
      pools:      {},
      search:     '',
      filterSlot: '',
      open:       {},
    };
  },

  computed: {
    matchCount() {
      const q = this.search.trim().toLowerCase();
      if (!q) return this.talents.length;
      return this.talents.filter(t => t.name.toLowerCase().includes(q)).length;
    },
    visibleSlotKeys() {
      return SLOT_ORDER.filter(k =>
        this.pools[k] !== undefined && (!this.filterSlot || this.filterSlot === k)
      );
    },
  },

  provide() {
    return {
      openState: this.open,                                        // reactive object
      doToggle:  (key) => { this.open[key] = !this.open[key]; },
      searchRef: computed(() => this.search),                      // reactive ref
      deepCount: (v) => this.deepCount(v),
      showTip:   (e, t) => this.showTip(e, t),
      hideTip:   () => this.hideTip(),
    };
  },

  methods: {
    async loadData() {
      const [talents, pools] = await Promise.all([
        fetch('data/talents.json').then(r => r.json()),
        fetch('data/talent_pools.json').then(r => r.json()),
      ]);
      this.talents = talents;
      this.pools   = pools;
      this.expandAll();
    },

    expandAll() {
      const walk = (data, path) => {
        if (path.length) this.open[path.join('_')] = true;
        if (!Array.isArray(data) && typeof data === 'object' && data !== null)
          Object.entries(data).forEach(([k, v]) => walk(v, [...path, k]));
      };
      SLOT_ORDER.forEach(k => { if (this.pools[k] !== undefined) walk(this.pools[k], [k]); });
    },

    collapseAll() { Object.keys(this.open).forEach(k => { this.open[k] = false; }); },

    deepCount(val) {
      if (Array.isArray(val)) return val.length;
      if (typeof val !== 'object' || val === null) return 0;
      return Object.values(val).reduce((s, v) => s + this.deepCount(v), 0);
    },

    showTip(event, talent) {
      let desc = talent.description || '';
      if (talent.description_values?.length) {
        let i = 0;
        desc = desc.replace(/#/g, () => talent.description_values[i++] ?? '#');
      }
      const el = document.getElementById('g-tip');
      el.innerHTML = `<div style="font-weight:700;margin-bottom:.2rem">${talent.name}</div><div>${desc}</div>`;
      el.style.display = 'block';
      const r = event.target.closest('.talent-chip').getBoundingClientRect();
      el.style.left = (r.right + 8) + 'px';
      el.style.top  = r.top + 'px';
    },
    hideTip() { document.getElementById('g-tip').style.display = 'none'; },
  },

  async mounted() {
    await this.loadData();
    this.loading = false;
  },
});

// ── talent-grid ──────────────────────────────────────────────────────────────
// Renders a flat chip grid; receives pre-filtered talent objects.
app.component('talent-grid', {
  props: { talents: { type: Array, default: () => [] } },
  inject: ['showTip', 'hideTip'],
  template: `
    <div class="talent-grid">
      <template v-if="talents.length">
        <div v-for="t in talents" :key="t.id" class="talent-chip"
             @mouseenter="showTip($event, t)" @mouseleave="hideTip()">
          <img :src="t.icon" @error="$event.target.style.opacity='.2'">
          <span>{{ t.name }}</span>
          <span class="chip-id">#{{ t.id }}</span>
        </div>
      </template>
      <span v-else class="chip-empty">無符合結果</span>
    </div>
  `,
});

// ── pool-node ─────────────────────────────────────────────────────────────────
// Recursive component:
//   Array  → leaf  → labeled sub-section + talent-grid  (depth 1+)
//           OR top-level section card with inline grid   (depth 0)
//   Object → node  → collapsible header + recurse into children
app.component('pool-node', {
  name: 'PoolNode',
  props: {
    nodeKey: { type: String, required: true },
    data:    { type: [Array, Object], required: true },
    depth:   { type: Number, default: 0 },
    path:    { type: Array,  default: () => [] },
  },
  inject: ['openState', 'doToggle', 'searchRef', 'deepCount'],

  computed: {
    openKey()   { return [...this.path, this.nodeKey].join('_'); },
    isOpen()    { return this.openState[this.openKey] !== false; },
    isLeaf()    { return Array.isArray(this.data); },
    entries()   { return this.isLeaf ? [] : Object.entries(this.data); },
    childPath() { return [...this.path, this.nodeKey]; },

    // filtered leaf items — reactive via searchRef
    filtered() {
      if (!this.isLeaf) return [];
      const q = this.searchRef.value?.trim().toLowerCase();
      if (!q) return this.data;
      return this.data.filter(t => (t.name || '').toLowerCase().includes(q));
    },

    // header counts: unfiltered total
    total() { return this.isLeaf ? this.data.length : this.deepCount(this.data); },

    slotLabel() { return SLOT_LABELS[this.nodeKey] || this.nodeKey; },
    badge()     { return this.nodeKey === 'ungroup' ? 'ungroup' : ['L1','L2','L3','L4'][Math.min(this.depth, 3)]; },
    badgeCls()  { return ['l1','l2','l3','l4'][Math.min(this.depth, 3)]; },
    headerCls() { return this.depth <= 1 ? 'l2-header' : 'l3-header'; },
    // border-color for leaf sub-sections derived purely from nodeKey + depth
    sectionCls() {
      if (this.depth === 1) return 'l2-' + this.nodeKey;   // e.g. l2-battle, l2-craft
      if (this.depth === 2) return 'l3';
      return 'l4';
    },
  },

  template: `
    <!-- depth 0: L1 section card ───────────────────────────────────────── -->
    <template v-if="depth === 0">
      <div class="section-card">
        <div class="section-header" @click="doToggle(openKey)">
          <span class="layer-badge l1">L1</span>
          <strong>{{ slotLabel }}</strong>
          <span class="badge-count">{{ total }}</span>
          <span class="collapse-icon">{{ isOpen ? '▲' : '▼' }}</span>
        </div>
        <div class="section-body" v-show="isOpen">
          <talent-grid v-if="isLeaf" :talents="filtered"></talent-grid>
          <pool-node v-else
            v-for="[k, v] in entries" :key="k"
            :node-key="k" :data="v" :depth="1" :path="childPath">
          </pool-node>
        </div>
      </div>
    </template>

    <!-- depth 1+, non-leaf: collapsible sub-header ─────────────────────── -->
    <template v-else-if="!isLeaf">
      <div class="mb-2">
        <div class="section-header rounded" :class="headerCls" @click="doToggle(openKey)">
          <span class="layer-badge" :class="badgeCls">{{ badge }}</span>
          <strong>{{ nodeKey }}</strong>
          <span class="badge-count">{{ total }}</span>
          <span class="collapse-icon">{{ isOpen ? '▲' : '▼' }}</span>
        </div>
        <div v-show="isOpen" class="ps-2 pt-1">
          <pool-node
            v-for="[k, v] in entries" :key="k"
            :node-key="k" :data="v" :depth="depth + 1" :path="childPath">
          </pool-node>
        </div>
      </div>
    </template>

    <!-- depth 1+, leaf: labeled sub-section ────────────────────────────── -->
    <template v-else>
      <div class="sub-section mb-2" :class="sectionCls">
        <div class="sub-label">
          <span class="layer-badge" :class="badgeCls">{{ badge }}</span>{{ nodeKey }}
          <span class="badge-count ms-1">{{ filtered.length }}</span>
        </div>
        <talent-grid :talents="filtered"></talent-grid>
      </div>
    </template>
  `,
});

app.mount('#app');
</script>
</body>
</html>
